<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="bouncing.css">
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* This completely kills the scrollbars */
      }
      .box {
        width: 70px;
        height: 70px;
        background-color: #eb6767;
        font-size: 300%;
        font-family:'Courier New', Courier, monospace;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        border-radius: 8px;
        /* Change me! */
        left: 0px;
      }

      .box-echo {
        width: 70px;
        height: 70px;
        background-color: #eb6767;
        border-radius: 8px;
        position: absolute;
        pointer-events: none; 
        
        opacity: 0.5;
        transform: scale(1);
        
        transition: transform 0.5s ease-out, opacity 0.5s ease-out;
      }

      .board {
        height: 100vh;
      }

      body {
        background: #efefef;
      }

      #speedcount {
        position: fixed;
        bottom: 15px;
        left: 50%;
        margin-left: 0px;
        transform: translateX(-50%);
        font-family:'Courier New', Courier, monospace;
        font-weight: 600;
        font-size: 30px;
      transition: font-size 0.5s ease-out;
      }

      .box-trail {
        width: 50px;
        height: 50px;
        background-color: #eb6767;
        border-radius: 6px;
        position: absolute;
        pointer-events: none; 
        opacity: 0.3;
        transform: translate(10px, 10px); 
        transition: opacity 1s ease-out, transform 1s ease-out;
      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
     
    <div class="box">?</div>
    <div id="speedcount">Speed: 0</div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        var speedCounter = jQuery("#speedcount");

        // Every 50 milliseconds, call the update Function (see below)
        setInterval(update, 10);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);

        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPositionX, newPositionY) {
          box.css("left", newPositionX);
          box.css("top", newPositionY);
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          box.text(newText);
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations
        var randNum = Math.random() * boardWidth;
        var positionX = 0;
        var points = 0;
        var speed = 3
        var positionY = 0;
        var speedY = Math.random () * 3;
        var boardHeight = jQuery(window).height();
        var frameCount = 0;
        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
        function update() {
          frameCount++;
          /* trails */
          if (frameCount % 3 === 0) {
            var trail = jQuery("<div></div>").addClass("box-trail");
            trail.css({
              "left": positionX + "px",
              "top": positionY + "px"
            });
            board.append(trail);
            setTimeout(function() {
              trail.css({
                "opacity": "0",
                "transform": "translate(10px, 10px) scale(0.2)"
              });
            }, .01);
            setTimeout(function() {
              trail.remove();
            }, 1000);
          }

          moveBoxTo(positionX, positionY);
          positionX += speed;
          positionY += speedY;

          if (positionX > boardWidth) {
            speed *= -1;
          }
          else if (positionX < 0) {
            speed *= -1;
          }

          if (positionY > boardHeight) {
            speedY *= -1;
          }
          else if (positionY < 0) {
            speedY *= -1;
          }

          var currentSpeed = Math.abs(speed);
          speedCounter.text("Speed: " + currentSpeed.toFixed(1));
        }

        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
        function handleBoxClick() {
          /* positionX = randNum;
          ^ i didnt like it resetting 
          randNum = Math.random() * boardWidth;
          ^ something for positonX i didnt need anymore */
          points += 1;
          var newspeed = 0.2 * points + 3;
          speedY = 0.2 * points + 3;

          /* box exploding out */
          var echo = jQuery("<div></div>").addClass("box-echo");
          echo.css({
            "left": positionX + "px",
            "top": positionY + "px"
          });
          board.append(echo);

          setTimeout(function() {
            echo.css({
              "transform": "scale(5)",
              "opacity": "0"
            });
          }, 10);

          setTimeout(function() {
            echo.remove();
          }, 500);

          if (speed > 0) {
            speed = -newspeed;
          } else {
            speed = newspeed;
          }
          changeBoxText(points);
        /* text becoming large then small */
        speedCounter.css("transition", "none");
          speedCounter.css("font-size", "45px");

          setTimeout(function() {
            speedCounter.css("transition", "font-size 0.5s ease-out");
            speedCounter.css("font-size", "30px");
          }, 50);
        }
      })();
    </script>
  </body>
</html>
